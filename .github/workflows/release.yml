name: Release and Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: termix-win-x64.zip

          - os: ubuntu-latest
            rid: linux-x64
            asset: termix-linux-x64.tar.gz

          - os: macos-latest
            rid: osx-x64
            asset: termix-osx-x64.zip

          - os: macos-latest
            rid: osx-arm64
            asset: termix-osx-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.asset }}

      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czvf ${{ matrix.asset }} -C publish .

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd publish
          zip -r ../${{ matrix.asset }} .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
